<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PT 면접 회의실</title>
<script src="config.js"></script>
<script src="data/scenario-hyundai-india.js"></script>
<script src="data/scenario-kia-cost.js"></script>
<script src="data/scenario-kia-us.js"></script>
<script src="data/scenario-kia-pbv.js"></script>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel-2:#1f232c; --line:#2a2f3a; --text:#e8eaef; --muted:#9aa1ad;
  --accent:#2d8cff; --ok:#3ccf7a; --warn:#f5b041; --danger:#ef5350; --floor:#232833; --table:#5b4636;
  --radius:12px;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#7fb6ff}
.hidden{display:none!important}

/* ---------- 상단 바 ---------- */
.topbar{height:48px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#12151b}
.topbar .rec{display:flex;align-items:center;gap:6px;color:var(--danger);font-weight:600;font-size:12px;flex:none}
.topbar .rec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--danger);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.topbar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.timer{white-space:nowrap;flex:none;font-variant-numeric:tabular-nums;background:var(--panel-2);padding:4px 10px;border-radius:8px;font-weight:600}
.timer.warn{color:var(--warn)} .timer.over{color:var(--danger)}

/* ---------- 단계 표시 ---------- */
.steps{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--line);overflow-x:auto;background:#12151b}
.steps span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.steps span.on{background:var(--accent);color:#fff}
.steps span.done{color:var(--ok)}

/* ---------- 레이아웃 ---------- */
.layout{display:grid;grid-template-columns:1fr 380px;height:calc(100% - 48px - 41px - 64px)}
.stage{position:relative;overflow:hidden;background:#0b0d11;min-height:0}
.side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-tabs{display:flex;border-bottom:1px solid var(--line)}
.side-tabs button{flex:1;padding:10px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted)}
.side-tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.side-body{flex:1;overflow:auto;padding:16px;min-height:0}

/* ---------- 하단 컨트롤 ---------- */
.controls{height:64px;display:flex;align-items:center;justify-content:center;gap:8px;border-top:1px solid var(--line);background:#12151b;padding:0 12px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 12px;border-radius:8px;font-size:11px;color:var(--muted);min-width:64px}
.ctl .ic{font-size:18px;line-height:1}
.ctl:hover{background:var(--panel-2);color:var(--text)}
.ctl.off .ic{opacity:.5}
.ctl.leave{color:var(--danger)}

/* ---------- 줌 화면 ---------- */
.zoom{position:absolute;inset:0;display:flex;padding:12px;gap:12px}
.gallery{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:8px}
.share{flex:1;display:flex;flex-direction:column;min-width:0;padding-bottom:84px}
.filmstrip{width:170px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.filmstrip .tile{height:96px;flex:none;min-height:0}
.tile{position:relative;background:var(--panel-2);border-radius:10px;display:flex;align-items:center;justify-content:center;border:2px solid transparent;overflow:hidden;min-height:90px}
.tile.speaking{border-color:var(--ok);box-shadow:0 0 0 2px rgba(60,207,122,.25)}
.tile .face{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;color:#fff}
.tile .label{position:absolute;left:8px;bottom:6px;font-size:12px;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:6px;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .badge{position:absolute;right:8px;top:6px;font-size:11px;background:var(--accent);padding:1px 6px;border-radius:6px}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}

/* ---------- 슬라이드 (Investor Day 템플릿) ---------- */
.deck-holder{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.deck-scaler{position:relative;flex:none;box-shadow:0 20px 60px rgba(0,0,0,.55);border-radius:6px;overflow:hidden}
.deck{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;color:#fff;font-family:var(--sans);background:#04060a;user-select:none}
.deck>div{position:absolute}
.d-bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 60% 70% at 78% 28%,rgba(46,84,158,.30),transparent 60%),
  radial-gradient(ellipse 50% 60% at 8% 95%,rgba(28,52,96,.28),transparent 60%),
  linear-gradient(180deg,#070a11,#020308)}
.d-bg::after{content:"";position:absolute;inset:0;opacity:.55;background-image:
  radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 34% 72%,#cfe0ff,transparent),
  radial-gradient(1px 1px at 58% 14%,#fff,transparent),radial-gradient(1.5px 1.5px at 82% 62%,#dfe9ff,transparent),
  radial-gradient(1px 1px at 91% 22%,#fff,transparent),radial-gradient(1px 1px at 46% 46%,#9fbfff,transparent),
  radial-gradient(1px 1px at 22% 88%,#fff,transparent),radial-gradient(1px 1px at 70% 90%,#cfe0ff,transparent)}
.d-dash{position:absolute;left:48px;top:50px;width:14px;height:2px;background:#fff}
.d-nav{position:absolute;right:40px;top:26px;display:flex;gap:26px;font-size:12px;color:#525a6a;letter-spacing:.02em}
.d-nav span{padding-bottom:6px;border-bottom:1px solid transparent}
.d-nav span.on{color:#fff;font-weight:700;border-bottom-color:#3fa9ff}
.d-page{position:absolute;right:40px;bottom:20px;font-size:11px;color:#7d8596}
.d-foot{position:absolute;left:48px;bottom:20px;font-size:10px;color:#565e6e;max-width:600px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-sec{font-size:13px;color:#c9cdd6;margin-bottom:8px}
.d-title{font-size:32px;font-weight:800;line-height:1.22;letter-spacing:-.02em;white-space:pre-line}
.d-title.sm{font-size:25px;line-height:1.3}
.d-desc{font-size:14px;color:#8f97a6;margin-top:14px;line-height:1.5;white-space:pre-line}
.d-kpis{position:absolute;display:flex;flex-direction:column;gap:10px}
.d-kpi{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 16px}
.d-kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#7cc4ff,#3f8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.d-kpi span{font-size:12px;color:#8f97a6}
.d-chart{position:absolute}
.d-unit{font-size:10px;color:#7d8596;margin-bottom:6px}
.d-bars{display:flex;gap:16px;height:160px}
.d-col{flex:1;display:flex;flex-direction:column;min-width:0}
.d-track{position:relative;flex:1;border-bottom:1px solid rgba(255,255,255,.18)}
.d-bar{position:absolute;left:20%;right:20%;border-radius:2px 2px 0 0;transition:height .6s ease,bottom .6s ease}
.d-bar.base{background:linear-gradient(180deg,#3d4863,#252d40)}
.d-bar.hl{background:linear-gradient(180deg,#56b4ff,#1f5fd6);box-shadow:0 0 22px rgba(63,169,255,.35)}
.d-bar.pos{background:linear-gradient(180deg,#5cb8ff,#2b72e0)}
.d-bar.neg{background:linear-gradient(180deg,#4b5268,#30364a)}
.d-val{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap}
.d-xl{font-size:11px;color:#9aa1ad;text-align:center;margin-top:6px;line-height:1.25;height:28px;overflow:hidden}
.d-points{position:absolute;display:flex;flex-direction:column;gap:12px}
.d-points.big{gap:22px}
.d-pt{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.4}
.d-points.big .d-pt{font-size:19px}
.d-pt i{flex:none;width:26px;height:26px;border-radius:50%;font-style:normal;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#56b4ff,#1f5fd6)}
.d-risk{position:absolute;display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.045);border-left:3px solid #9be11e;padding:10px 14px;font-size:14px;color:#dfe3ea}
.d-risk em{font-style:normal;font-size:10px;font-weight:800;color:#9be11e;letter-spacing:.1em}
.d-facts{position:absolute;display:flex;flex-direction:column;gap:10px}
.d-fact{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:9px 12px;font-size:13px;line-height:1.45;color:#dfe3ea}
.d-fact em{font-style:normal;color:#3fa9ff;font-size:11px;margin-left:6px}
.rv{opacity:.07;transform:translateY(6px);transition:opacity .5s ease,transform .5s ease}
.rv.on{opacity:1;transform:none}

/* 편집 가능한 요소 */
.el{position:absolute;display:flex;overflow:visible}
.el-text{width:100%;white-space:pre-wrap;word-break:keep-all;line-height:1.3;outline:none;padding:2px 4px}
.el.v-center{align-items:center}
.el svg.shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.el.v-center .el-text{position:relative}
.editing .el-text{cursor:text;user-select:text;-webkit-user-select:text;background:rgba(63,169,255,.08)}
.sel-box{position:absolute;border:1px dashed #3fa9ff;pointer-events:none}
.handle{position:absolute;background:#fff;border:2px solid #2d8cff;border-radius:2px;z-index:50}

/* ---------- 편집기 ---------- */
.editor{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px 12px 12px;gap:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.toolbar .grp{display:flex;gap:4px;align-items:center;padding-right:8px;border-right:1px solid var(--line)}
.toolbar .grp:last-child{border-right:0}
.tb{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tb:hover{border-color:#3a4252}
.tb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tb:disabled{opacity:.35;cursor:not-allowed}
.toolbar select,.toolbar input[type=number]{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--text);height:30px;padding:0 6px;font:inherit;font-size:12px}
.toolbar input[type=number]{width:56px}
.toolbar label.c{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.toolbar input[type=color]{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;background:none;padding:0}
.toolbar :disabled{opacity:.35}

/* ---------- 메타버스 회의실 ---------- */
.meta{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.room{position:relative;width:1000px;height:640px;transform-origin:center center;background:
  repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.035) 39px 40px),
  repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.035) 39px 40px),var(--floor);
  border:10px solid #343b48;border-radius:18px;box-shadow:inset 0 0 80px rgba(0,0,0,.5)}
.room .screen{position:absolute;left:300px;top:-4px;width:400px;height:66px;background:#04060a;border:3px solid #4a5263;border-top:0;border-radius:0 0 8px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:#8f97a6;text-align:center;padding:0 12px}
.room .screen b{color:#fff;font-size:13px}
.room .table{position:absolute;left:300px;top:230px;width:400px;height:180px;border-radius:90px;background:linear-gradient(180deg,#6a5340,var(--table));box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.08)}
.room .table::after{content:attr(data-label);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.35);font-size:13px;letter-spacing:.1em}
.room .desk{position:absolute;left:380px;top:100px;width:240px;height:40px;border-radius:8px;background:#3b4252;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.room .deco{position:absolute;font-size:28px;opacity:.9}
.room .door{position:absolute;left:-10px;top:520px;width:10px;height:70px;background:#8a6a4a}
.room .wb{position:absolute;right:30px;top:180px;width:16px;height:220px;background:#e9edf2;border-radius:4px}
.avatar{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 10px rgba(0,0,0,.45);transition:left .12s linear,top .12s linear}
.avatar .tag{position:absolute;top:50px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;white-space:nowrap;background:rgba(0,0,0,.6);padding:1px 7px;border-radius:6px}
.avatar.speaking::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--ok);animation:pulse 1.2s infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}
.avatar.me{border-color:var(--accent);z-index:5}
.avatar.me .tag{background:var(--accent)}
.avatar.seat-empty{opacity:.25;border-style:dashed}
.bubble{position:absolute;z-index:10;max-width:280px;background:#fff;color:#111;padding:8px 12px;border-radius:12px;font-size:12px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.4);transform:translate(-50%,calc(-100% - 34px));pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#fff;transform:translateX(-50%) rotate(45deg)}
.bubble b{display:block;font-size:11px;color:#555;margin-bottom:2px}
.near-card{position:absolute;left:16px;right:16px;bottom:16px;max-width:560px;margin:0 auto;background:rgba(23,26,33,.96);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;z-index:20}
.near-card h4{margin:0 0 4px;display:flex;gap:8px;align-items:center}
.near-card .stance{font-size:12px;color:var(--warn)}
.near-card p{margin:6px 0 0;color:#cfd4dd;font-size:13px}
.meta-hint{position:absolute;left:16px;top:12px;font-size:12px;color:var(--muted);background:rgba(0,0,0,.4);padding:4px 10px;border-radius:8px;z-index:20}

/* ---------- 자막 ---------- */
.caption{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(760px,calc(100% - 32px));background:rgba(0,0,0,.8);border-radius:10px;padding:10px 14px;z-index:30;font-size:14px}
.caption b{color:#9fd0ff;margin-right:6px}
.meta-on .caption,.edit-on .caption{display:none}

/* ---------- 사이드 패널 ---------- */
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:15px}
.k{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:4px}
.mine{border-color:var(--accent);background:rgba(45,140,255,.08)}
.facts{margin:0;padding-left:18px;color:#cfd4dd;font-size:13px}
.facts li{margin-bottom:6px}
.facts sup a{text-decoration:none;font-size:10px}
.src{font-size:12px;color:var(--muted);padding-left:18px}
.src li{margin-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.block{width:100%;margin-top:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:6px;margin-top:10px}
.btn-row .btn{flex:1;padding:8px 6px;font-size:12px}
.row{display:flex;gap:8px;align-items:center}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input.t,textarea.t{width:100%;background:#0f1218;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font:inherit;resize:vertical}
input.t:focus,textarea.t:focus{outline:2px solid var(--accent);border-color:transparent}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.log-item{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.log-item .who{font-weight:600;font-size:12px}
.log-item .when{color:var(--muted);font-size:11px;margin-left:6px}
.pressure{border-color:var(--danger);background:rgba(239,83,80,.08)}
.prog{height:4px;background:#0f1218;border-radius:2px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.tl{list-style:none;margin:0 0 12px;padding:0}
.tl li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.tl li .dot{width:10px;height:10px;border-radius:50%;flex:none}
.tl li .st{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.tl li.now .st{color:var(--ok);font-weight:700}
details.team-talk{margin-top:6px}
details.team-talk summary{cursor:pointer;font-size:13px;font-weight:600}
details.team-talk p{margin:6px 0 0;font-size:13px;color:#cfd4dd}
.score-row{margin-bottom:10px}
.score-row .bar{height:8px;background:#0f1218;border-radius:4px;overflow:hidden;margin-top:4px}
.score-row .bar i{display:block;height:100%;background:var(--accent)}
.score-row .tip{font-size:12px;color:var(--muted);margin-top:3px}
.total{font-size:32px;font-weight:700}
kbd{background:#0f1218;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px}

/* ---------- 입장 화면 ---------- */
.join{position:fixed;inset:0;background:radial-gradient(ellipse at top,#1a2333,#0b0d11 70%);z-index:100;overflow:auto;padding:32px 16px}
.join-inner{max-width:1000px;margin:0 auto}
.join h1{margin:0 0 4px;font-size:24px}
.join .sub{color:var(--muted);margin:0 0 20px}
.join h2{font-size:15px;margin:22px 0 4px}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:10px;margin-top:10px}
.co-sec{margin-top:12px}
.co-head{font-size:13px;font-weight:700;color:#7fb6ff;margin-bottom:-2px}
.sc-card{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.sc-card.sel{border-color:var(--accent);background:rgba(45,140,255,.08)}
.sc-card .co{font-size:11px;font-weight:700;color:#7fb6ff}
.sc-card .nm{font-weight:700}
.sc-card .ds{font-size:12px;color:var(--muted)}
.agenda-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-top:16px}
.agenda-box h3{margin:4px 0 8px;font-size:18px}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin:12px 0 20px}
.team-card{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:6px}
.team-card:hover{border-color:#3a4252}
.team-card.sel{border-color:var(--accent);background:rgba(45,140,255,.08)}
.team-card .nm{display:flex;align-items:center;gap:8px;font-weight:700}
.team-card .dot{width:12px;height:12px;border-radius:50%}
.team-card .pr{font-size:13px;color:#cfd4dd}
.team-card.excluded{opacity:.45;cursor:not-allowed;border-style:dashed}
.join-foot{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.join-foot .grow{flex:1;min-width:200px}
.join-need{font-size:12px;color:var(--warn);margin-top:6px;min-height:18px}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;grid-template-rows:55% 45%}
  .side{border-left:0;border-top:1px solid var(--line)}
  .gallery{grid-template-columns:repeat(3,1fr)}
  .filmstrip{display:none}
  .ctl{min-width:48px;padding:6px 6px}
  .ctl .tx{display:none}
  .toolbar .grp{border-right:0;padding-right:0}
}

</head>

<script>
(() => {
"use strict";
const ALL = window.SCENARIOS || [];
let S = null;
const $ = (s, root = document) => root.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const at = (e, x, y, w, h) => { e.style.left = x + "px"; e.style.top = y + "px"; if (w != null) e.style.width = w + "px"; if (h != null) e.style.height = h + "px"; return e; };
const SVGNS = "http://www.w3.org/2000/svg";
const svg = (tag, attrs = {}) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const W = 960, H = 540;

const DEFAULT_RUBRIC = [
  { id: "fit", label: "화두 적합성" }, { id: "evidence", label: "근거·수치" }, { id: "collab", label: "타 부서 고려" },
  { id: "risk", label: "리스크·대안" }, { id: "structure", label: "구조·전달" },
];
const DEFAULT_COMMON = ["다른 부서 의견 중 가장 동의하기 어려운 것은 무엇이고, 어떻게 조율하겠습니까?", "입사 후 이 과제를 맡는다면 첫 30일 동안 무엇부터 하겠습니까?"];
const FONTS = {
  sans: 'var(--sans)', serif: '"AppleMyungjo","Nanum Myeongjo","Noto Serif KR",serif',
  round: '"Arial Rounded MT Bold","BM JUA","Jua","Apple SD Gothic Neo",sans-serif', mono: 'Menlo,Consolas,monospace',
  display: '"Avenir Next","Helvetica Neue",Arial,sans-serif',
};

/* ---------------- 상태 ---------------- */
const PHASES = [
  { id: "brief", label: "발제" }, { id: "meeting", label: "부서별 발표" }, { id: "prep", label: "내 PPT 만들기" },
  { id: "present", label: "발표" }, { id: "rebuttal", label: "반박 대응" }, { id: "qa", label: "질의응답" }, { id: "result", label: "결과" },
];
const st = {
  name: "", team: null, phase: null, phaseStartedAt: {}, startedAt: null,
  view: "zoom", tab: "act", speakerId: null, presented: new Set(), log: [],
  script: "", scriptSource: "typed", presentSeconds: 0,
  rebuttal: null, qa: [], qaIndex: 0,
  me: { x: 0, y: 0 }, visited: new Set(), tts: false, mic: null, cam: null, timer: null,
};
const MT = { queue: [], team: null, step: 0, auto: true, timer: null };   // 부서별 발표 진행
const ED = { els: [], sel: null, hist: [], editing: null, lastDown: null }; // 내 PPT 편집기

const SEATS = [ {x:380,y:198},{x:500,y:198},{x:620,y:198},{x:380,y:442},{x:500,y:442},{x:620,y:442} ];
const IV_SEATS = [ {x:450,y:80},{x:550,y:80} ];
const TABLE = { x1:300, y1:230, x2:700, y2:410 };
const teamById = id => S.teams.find(t => t.id === id);
const myTeam = () => teamById(st.team);
const initials = s => s.replace(/(책임|매니저|상무|실장|면접관)/g, "").trim().slice(0, 1) || "?";
const footnote = () => `※ 출처: ${S.agenda.sources.map(s => `${s.outlet} ${s.title.length > 26 ? s.title.slice(0, 26) + "…" : s.title}`).join(" / ")} · '(가정)'은 팀 가정치`;

/* ================= 입장 화면 ================= */
const COMPANY_ORDER = ["현대자동차", "기아"];
function companies(){
  const map = new Map();
  ALL.forEach(sc => { if (!map.has(sc.company.name)) map.set(sc.company.name, []); map.get(sc.company.name).push(sc); });
  return [...map].map(([name, items]) => ({ name, items })).sort((a, b) => (COMPANY_ORDER.indexOf(a.name) + 99) % 99 - (COMPANY_ORDER.indexOf(b.name) + 99) % 99);
}
function renderJoin(){
  const sg = $("#scGrid"); sg.innerHTML = "";
  companies().forEach(co => {
    const sec = el("div", "co-sec"), grid = el("div", "sc-grid");
    sec.append(el("div", "co-head", `${co.name} · 발제 ${co.items.length}개`), grid);
    co.items.forEach(sc => {
      const b = el("button", "sc-card" + (sc === S ? " sel" : ""));
      b.append(el("span", "nm", sc.shortTitle), el("span", "ds", `${sc.agenda.sources[0].outlet} · ${sc.agenda.sources[0].date}`));
      b.onclick = () => { S = sc; st.team = null; renderJoin(); };
      grid.append(b);
    });
    sg.append(sec);
  });
  const ab = $("#agendaBox"); ab.innerHTML = "";
  ab.append(el("div", "k", `${S.company.name} · ${S.company.interviewType} · 준비 ${S.agenda.prepMinutes}분 · 발표 ${Math.round(S.agenda.speakSeconds / 60)}분`), el("h3", null, S.agenda.title), el("div", null, S.agenda.situation));
  const grid = $("#teamGrid"); grid.innerHTML = "";
  S.teams.forEach(t => {
    const b = el("button", "team-card" + (st.team === t.id ? " sel" : ""));
    const nm = el("div", "nm"), dot = el("span", "dot"); dot.style.background = t.color;
    nm.append(dot, document.createTextNode(t.name));
    b.append(nm, el("div", "pr", "화두 · " + t.prompt));
    b.onclick = () => { st.team = t.id; renderJoin(); };
    grid.append(b);
  });
  S.excludedTeams.forEach(x => { const b = el("div", "team-card excluded"); b.append(el("div", "nm", x.name + " — 이번 발제 제외"), el("div", "pr", x.reason)); grid.append(b); });
  checkJoin();
}
const nameInput = $("#nameInput");
nameInput.oninput = checkJoin;
function checkJoin(){
  const need = [!st.team && "직무를 선택하세요", !nameInput.value.trim() && "이름을 입력하세요"].filter(Boolean);
  $("#joinBtn").disabled = need.length > 0;
  $("#joinNeed").textContent = need.length ? "입장하려면: " + need.join(" · ") : "";
}
nameInput.addEventListener("keydown", e => { if (e.key === "Enter" && !$("#joinBtn").disabled) $("#joinBtn").click(); });
$("#joinBtn").onclick = () => {
  st.name = nameInput.value.trim(); st.startedAt = new Date().toISOString();
  st.stage = $("#stageInput").value; st.interviewDate = $("#dateInput").value;
  $("#join").classList.add("hidden");
  $("#meetingTitle").textContent = `${S.company.name} · ${S.agenda.title}`;
  $("#roomTable").dataset.label = S.tableLabel || "PT 회의";
  const mySeat = SEATS[myTeam().seat];
  st.me = { x: mySeat.x, y: mySeat.y + (mySeat.y < 300 ? -46 : 46) };
  ED.els = templateElements();
  buildRoom();
  setPhase("brief");
  say("iv1", `${st.name}님 반갑습니다. ${S.company.name} PT 면접을 시작하겠습니다. 화면에 띄운 발제를 확인하시고, ${myTeam().name} 입장에서 화두를 준비해 주세요.`);
};

/* ================= 단계 ================= */
function renderSteps(){
  const nav = $("#steps"); nav.innerHTML = "";
  const cur = PHASES.findIndex(p => p.id === st.phase);
  PHASES.forEach((p, i) => nav.append(el("span", i === cur ? "on" : i < cur ? "done" : "", `${i + 1}. ${p.label}`)));
}
function setPhase(p){
  st.phase = p; st.phaseStartedAt[p] = Date.now();
  stopTimer(); clearTimeout(MT.timer); renderSteps(); st.tab = "act"; renderTabs();
  if (p !== "prep") { commitEdit(); ED.sel = null; }
  if (p === "brief") startTimer(S.agenda.prepMinutes * 60, "준비");
  if (p === "meeting") return startMeeting();
  if (p === "prep") { st.speakerId = "me"; hideCaption(); startTimer(S.agenda.prepMinutes * 60, "준비"); }
  if (p === "present") { st.speakerId = "me"; startTimer(S.agenda.speakSeconds, "발표"); }
  if (p === "rebuttal") { startRebuttal(); return renderSide(); }
  if (p === "qa") return startQA();
  if (p === "result") { st.speakerId = null; hideCaption(); }
  renderSide(); renderStage();
}

/* ================= 타이머 ================= */
function startTimer(seconds, label){
  stopTimer();
  const end = Date.now() + seconds * 1000, t = $("#timer");
  const tick = () => {
    const left = Math.round((end - Date.now()) / 1000), a = Math.abs(left);
    t.textContent = `${label} ${left < 0 ? "+" : ""}${String(Math.floor(a / 60)).padStart(2, "0")}:${String(a % 60).padStart(2, "0")}`;
    t.className = "timer" + (left < 0 ? " over" : left <= 30 ? " warn" : "");
  };
  tick(); st.timer = setInterval(tick, 500);
}
function stopTimer(){ clearInterval(st.timer); $("#timer").textContent = "--:--"; $("#timer").className = "timer"; }
const elapsed = p => Math.round((Date.now() - (st.phaseStartedAt[p] || Date.now())) / 1000);

/* ================= 발언 / 자막 / 회의록 ================= */
function who(id){
  if (id === "me") return { name: st.name, team: myTeam().name, color: "#2d8cff" };
  const iv = S.interviewers.find(i => i.id === id); if (iv) return { name: iv.name, team: iv.title, color: iv.color };
  const t = teamById(id); return { name: t.npc.name, team: t.name, color: t.color };
}
let typing = null, sayToken = 0;
function say(id, text, kind = "speech", onDone){
  const token = ++sayToken;
  st.speakerId = id; const w = who(id);
  st.log.push({ at: new Date().toISOString(), speakerId: id, speaker: w.name, team: w.team, kind, text });
  const c = $("#caption"); c.classList.remove("hidden"); c.innerHTML = "";
  const span = el("span"); c.append(el("b", null, `${w.name} (${w.team})`), span);
  let typed = false, spoken = !(st.tts && "speechSynthesis" in window);
  const finish = () => { if (typed && spoken && token === sayToken && onDone) onDone(); };
  clearInterval(typing); let i = 0;
  typing = setInterval(() => { span.textContent = text.slice(0, i += 2); if (i >= text.length) { clearInterval(typing); typed = true; finish(); } }, 22);
  if (!spoken) {
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "ko-KR"; u.rate = 1.1;
    u.onend = u.onerror = () => { spoken = true; finish(); }; speechSynthesis.speak(u);
  }
  renderStage(text);
}
function hideCaption(){ $("#caption").classList.add("hidden"); clearInterval(typing); sayToken++; if ("speechSynthesis" in window) speechSynthesis.cancel(); }

/* ================= 부서별 발표 (단계별 진행) ================= */
function startMeeting(){ MT.queue = S.teams.filter(t => t.id !== st.team).map(t => t.id); nextTeam(); }
function nextTeam(){
  clearTimeout(MT.timer);
  const id = MT.queue.shift();
  if (!id) {
    MT.team = null;
    say("iv1", `각 부서 발표 잘 들었습니다. 이제 ${myTeam().name} 차례입니다. 다른 부서 주장을 고려해 1장짜리 PPT를 직접 만들어 주세요.`);
    return renderSide();
  }
  MT.team = id; MT.step = 0; st.presented.add(id); playStep();
}
function playStep(){
  clearTimeout(MT.timer);
  const t = teamById(MT.team);
  say(MT.team, t.npc.talk[MT.step], "presentation", scheduleNext);
  renderSide();
}
function scheduleNext(){
  if (!MT.auto || st.phase !== "meeting") return;
  const len = teamById(MT.team).npc.talk[MT.step].length;
  MT.timer = setTimeout(advance, st.tts ? 700 : Math.min(5500, 1600 + len * 35));
}
function advance(){
  const t = teamById(MT.team); if (!t) return;
  if (MT.step < t.npc.talk.length - 1) { MT.step++; playStep(); } else nextTeam();
}

/* ================= 반박 / 질의응답 ================= */
function startRebuttal(){
  const c = S.conflicts[st.team];
  st.rebuttal = { from: c.from, prompt: c.text, answer: "", seconds: 0 };
  say(c.from, c.text, "rebuttal");
  startTimer(60, "반박 답변");
}
function startQA(){
  const own = S.followUps[st.team] || [], common = S.followUps.common || DEFAULT_COMMON;
  st.qa = [ { by: "iv1", q: own[0] }, { by: "iv2", q: common[Math.floor(Math.random() * common.length)] } ].filter(x => x.q).map(x => ({ ...x, answer: "", seconds: 0 }));
  st.qaIndex = 0; askQ();
}
function askQ(){
  const q = st.qa[st.qaIndex]; if (!q) return setPhase("result");
  q.askedAt = Date.now(); say(q.by, q.q, "question"); startTimer(90, "답변"); renderSide();
}

/* ================= 슬라이드 공통 (Investor Day 템플릿) ================= */
function mountDeck(holder){
  holder.innerHTML = "";
  const scaler = el("div", "deck-scaler"), deck = el("div", "deck");
  scaler.append(deck); holder.append(scaler); fitDeck(holder);
  if (!holder._ro) { holder._ro = new ResizeObserver(() => fitDeck(holder)); holder._ro.observe(holder); }
  return deck;
}
function fitDeck(holder){
  const scaler = holder.querySelector(".deck-scaler"), deck = holder.querySelector(".deck"); if (!deck) return;
  const k = Math.max(0.1, Math.min(holder.clientWidth / W, holder.clientHeight / H));
  scaler.style.width = W * k + "px"; scaler.style.height = H * k + "px";
  deck.style.transform = `scale(${k})`; deck.dataset.k = k;
}
function chrome(deck, { nav = [], active = -1, page = "", foot = "" }){
  deck.append(el("div", "d-bg"), el("div", "d-dash"));
  if (nav.length) { const n = el("div", "d-nav"); nav.forEach((t, i) => n.append(el("span", i === active ? "on" : "", t))); deck.append(n); }
  if (page) deck.append(el("div", "d-page", page));
  if (foot) deck.append(el("div", "d-foot", foot));
}
const fmt = v => (Math.round(v * 100) / 100).toLocaleString("ko-KR");
function drawChart(box, ch){
  box.append(el("div", "d-unit", `(단위: ${ch.unit})`));
  const area = el("div", "d-bars"); box.append(area);
  let cols;
  if (ch.type === "waterfall") {
    let cum = ch.start.value; cols = [{ label: ch.start.label, lo: 0, hi: cum, txt: fmt(cum), kind: "base" }];

const avatars = {};
function buildRoom(){

  room.addEventListener("click", e => { const r = room.getBoundingClientRect(), k = r.width / 1000; walkTo((e.clientX - r.left) / k, (e.clientY - r.top) / k); });
  fitRoom(); window.addEventListener("resize", fitRoom);

function addAvatar(room, txt, tag, color, pos, extra = ""){
  const a = el("div", "avatar " + extra, txt); a.style.background = color; a.style.left = pos.x + "px"; a.style.top = pos.y + "px";

}
function fitRoom(){ const stage = $("#stage"); $("#room").style.transform = `scale(${Math.min((stage.clientWidth - 24) / 1020, (stage.clientHeight - 24) / 660, 1.2)})`; }
function blocked(x, y){
  const r = 26;
  if (x < 30 || x > 970 || y < 70 || y > 610) return true;
  return x > TABLE.x1 - r && x < TABLE.x2 + r && y > TABLE.y1 - r && y < TABLE.y2 + r;
}
function moveMe(dx, dy){
  const nx = st.me.x + dx, ny = st.me.y + dy;
  if (!blocked(nx, st.me.y)) st.me.x = nx;
  if (!blocked(st.me.x, ny)) st.me.y = ny;
  avatars.me.style.left = st.me.x + "px"; avatars.me.style.top = st.me.y + "px"; checkNear();
}
let walking = null;
function walkTo(tx, ty){
  clearInterval(walking);
  walking = setInterval(() => {
    const dx = tx - st.me.x, dy = ty - st.me.y, d = Math.hypot(dx, dy);
    if (d < 6) return clearInterval(walking);
    const bx = st.me.x, by = st.me.y; moveMe(dx / d * 6, dy / d * 6);
    if (bx === st.me.x && by === st.me.y) clearInterval(walking);
  }, 16);
}
const keys = new Set();
document.addEventListener("keydown", e => {

  const k = e.key.toLowerCase(); if (["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].includes(k)) { keys.add(k); e.preventDefault(); }
});
document.addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
setInterval(() => {
  if (!keys.size) return;
  let dx = 0, dy = 0;
  if (keys.has("w") || keys.has("arrowup")) dy -= 5; if (keys.has("s") || keys.has("arrowdown")) dy += 5;
  if (keys.has("a") || keys.has("arrowleft")) dx -= 5; if (keys.has("d") || keys.has("arrowright")) dx += 5;
  clearInterval(walking); moveMe(dx, dy);
}, 16);

function selfScore(){
  const t = myTeam();
  const texts = ED.els.map(e => e.text || "").filter(filled), slideText = texts.join(" ");
  const all = [slideText, st.script, st.rebuttal?.answer || "", ...st.qa.map(q => q.answer)].join(" ");
  const others = S.teams.filter(x => x.id !== st.team);
  const kw = t.keywords.filter(k => all.includes(k)).length;
  const facts = (S.factTokens || []).filter(k => all.includes(k)).length + Math.min(3, (all.match(/\d+(\.\d+)?\s*(%|만|억|조|대|개월|년)/g) || []).length);
  const mentioned = others.filter(o => all.includes(o.name.replace("팀", ""))).length;
  const riskText = elText("risk").filter(filled).join(" ") + " " + texts.filter(s => /리스크|위험/.test(s)).join(" ");
  const riskOk = riskText.trim().length >= 10, riskAlt = /대응|대안|완화|보완|절충|단계|→/.test(riskText + st.script);
  const titleOk = elText("title").some(filled);
  const pointsFilled = Math.min(3, elText("point").filter(filled).length + ED.els.filter(e => e.role === "free" && e.type === "text" && filled(e.text)).length);
  const askOk = elText("ask").some(filled), scriptLen = st.script.trim().length;
  const timeOk = st.presentSeconds > 0 && st.presentSeconds <= S.agenda.speakSeconds + 15;
  const clamp = v => Math.max(1, Math.min(5, v));
  return {
    fit: { score: clamp(1 + kw), tip: kw >= 3 ? "화두 핵심어를 충분히 다뤘습니다." : `화두 핵심어(${t.keywords.slice(0, 4).join(", ")} 등)를 더 직접적으로 다루세요.` },
    evidence: { score: clamp(1 + Math.floor(facts / 2)), tip: facts >= 4 ? "발제 사실과 수치를 근거로 잘 썼습니다." : "'발제' 탭의 수치를 슬라이드와 발표에 인용하세요." },
    collab: { score: clamp(1 + mentioned + (askOk ? 1 : 0) + ((st.rebuttal?.answer || "").length > 40 ? 1 : 0)), tip: mentioned >= 2 ? "다른 부서 입장을 언급하며 조율했습니다." : "반박한 부서를 포함해 2개 이상 부서의 입장을 언급하고 절충안을 내세요." },
    risk: { score: clamp((riskOk ? 3 : 1) + (riskAlt ? 2 : 0)), tip: riskOk && riskAlt ? "리스크와 대응을 함께 제시했습니다." : "리스크 한 가지와 그 대응책을 짝지어 쓰세요." },
    structure: { score: clamp((titleOk ? 1 : 0) + pointsFilled + (scriptLen >= 250 ? 1 : 0) - (timeOk ? 0 : 1)), tip: !timeOk ? "제한 시간을 지키지 못했습니다." : !titleOk ? "슬라이드 제목에 결론을 쓰세요." : pointsFilled < 3 ? "실행 방안 3개를 모두 채우세요." : "결론-근거-실행 구조가 갖춰졌습니다." },
  };
}

  const msg = el("div", "hint");
  btn.onclick = async () => {
    btn.disabled = true; msg.textContent = "저장 중…";
    try {
      const r = await fetch(BACKEND.replace(/\/$/, "") + "/api/sessions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...sessionPayload(sc), consent: true }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
      st.saved = await r.json(); renderSide();
    } catch (e) { msg.textContent = "저장하지 못했습니다: " + e.message; btn.disabled = false; }
  };
  c.append(el("div", "k", "결과 저장"), lab, btn, msg);
}
function outcomePanel(c){
  c.append(el("div", "k", "저장 완료 · 한 가지만 더"), el("div", "hint", "이번 연습이 도움이 됐나요? 실제 면접 결과가 나오면 알려주세요."));
  const send = async (data, done) => {
    const r = await fetch(`${BACKEND.replace(/\/$/, "")}/api/sessions/${st.saved.sessionId}/outcome`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...data, editToken: st.saved.editToken }) });
    done.textContent = r.ok ? "기록했습니다." : "기록하지 못했습니다.";
  };
  const row1 = el("div", "btn-row"), d1 = el("div", "hint");
  [1, 2, 3, 4, 5].forEach(n => { const b = el("button", "btn", "★".repeat(n)); b.onclick = () => send({ satisfaction: n }, d1); row1.append(b); });
  const row2 = el("div", "btn-row"), d2 = el("div", "hint");
  ["합격", "불합격", "미정"].forEach(v => { const b = el("button", "btn", v); b.onclick = () => send({ actualResult: v }, d2); row2.append(b); });
  c.append(el("label", "f", "만족도"), row1, d1, el("label", "f", "실제 면접 결과"), row2, d2);
}
function sessionPayload(score){
  const rb = st.rebuttal ? { ...st.rebuttal, fromName: teamById(st.rebuttal.from)?.name } : null;
  return {
    scenarioId: S.id, scenarioTitle: S.shortTitle, companyId: S.company.id, companyName: S.company.name, team: st.team, teamName: myTeam().name,
    applicant: { displayName: st.name, stage: st.stage || "", interviewDate: st.interviewDate || "" },
    slideTitle: slideTitle(), withinTime: st.presentSeconds > 0 && st.presentSeconds <= S.agenda.speakSeconds + 15,
    visitedSeatNames: [...st.visited].map(id => teamById(id)?.name).filter(Boolean),
    startedAt: st.startedAt, endedAt: new Date().toISOString(),
    slide: { elements: ED.els, text: ED.els.map(e => e.text).filter(filled) },
    script: { text: st.script, source: st.scriptSource, seconds: st.presentSeconds },
    rebuttal: rb, qa: st.qa.map(({ by, q, answer, seconds }) => ({ by, question: q, answer, seconds })),
    visitedSeats: [...st.visited], selfScore: Object.fromEntries(Object.entries(score).map(([k, v]) => [k, v.score])),
    transcript: st.log,
  };
}
function download(obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = el("a"); a.href = URL.createObjectURL(blob); a.download = `pt-session-${S.id}-${Date.now()}.json`; a.click(); URL.revokeObjectURL(a.href);
}

/* ================= 하단 컨트롤 ================= */
$("#viewBtn").onclick = () => {
  if (!st.phase) return;
  commitEdit();
  st.view = st.view === "zoom" ? "meta" : "zoom";
  $("#viewBtn .tx").textContent = st.view === "meta" ? (st.phase === "prep" ? "PPT 편집으로" : "줌 화면으로") : "회의실 전체 보기";
  $("#viewBtn .ic").textContent = st.view === "meta" ? "🎥" : "🏢";
  if (st.view === "meta") fitRoom();
  renderStage(st.log.at(-1)?.text);
};
$("#ttsBtn").onclick = () => { st.tts = !st.tts; $("#ttsBtn").classList.toggle("off", !st.tts); if (!st.tts && "speechSynthesis" in window) speechSynthesis.cancel(); };
$("#camBtn").onclick = async () => {
  if (st.cam) { st.cam.getTracks().forEach(t => t.stop()); st.cam = null; }
  else { try { st.cam = await navigator.mediaDevices.getUserMedia({ video: true }); } catch { alert("카메라를 사용할 수 없습니다. 브라우저 권한을 확인하세요."); } }
  $("#camBtn").classList.toggle("off", !st.cam); if (st.phase) renderStage();
};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function stopMic(){ if (st.mic) { st.mic.onend = null; st.mic.stop(); st.mic = null; } $("#micBtn").classList.add("off"); }
$("#micBtn").onclick = () => {
  if (st.mic) return stopMic();
  if (!SR) return alert("이 브라우저는 음성 받아쓰기를 지원하지 않습니다. Chrome에서 열거나 직접 입력하세요.");
  if (st.phase !== "present") return alert("마이크 받아쓰기는 발표 단계에서 사용합니다.");
  const r = new SR(); r.lang = "ko-KR"; r.continuous = true; r.interimResults = false;
  r.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) st.script += (st.script ? " " : "") + e.results[i][0].transcript.trim();
    st.scriptSource = "speech"; const box = $("#scriptBox"); if (box) box.value = st.script;
  };
  r.onend = () => { if (st.mic) r.start(); };
  r.start(); st.mic = r; $("#micBtn").classList.remove("off");
};
$("#leaveBtn").onclick = () => { if (confirm("면접을 종료하고 나갈까요?")) location.href = "index.html"; };

/* ================= 시작 ================= */
const want = new URLSearchParams(location.search).get("s");
S = ALL.find(s => s.id === want) || ALL[0];
renderJoin();
})();
</script>
